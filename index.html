<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adventure Maker</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="locales/en.js"></script>
  <script defer src="locales/es.js"></script>
  <script defer src="story.js"></script>
  <script defer src="vendor/pdf-lib/pdf-lib.min.js"></script>
  <script defer src="vendor/fontkit/fontkit.umd.min.js"></script>
  <script defer src="vendor/fonts/font-data.js"></script>
  <script defer src="vendor/twemoji/emoji-data.js"></script>
  <script defer src="pdf-export.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1 data-i18n="appTitle">Adventure Maker</h1>
      <div class="actions">
        <label for="language" data-i18n="language">Language</label>
        <select id="language"><option value="en">English</option><option value="es">Español</option></select>
        <button id="save" type="button" data-i18n="save">Save JSON</button>
        <button id="load" type="button" data-i18n="load">Load JSON</button>
        <input id="file" type="file" accept=".json,application/json" hidden>
        <button id="print" type="button" data-i18n="print">Save A5 PDF</button>
      </div>
    </header>
    <main>
      <section class="info panel">
        <h2 data-i18n="storyInfo">Story information</h2>
        <div class="fields">
          <label><span data-i18n="title">Title</span><input id="story-title" type="text"></label>
          <label><span data-i18n="author">Author</span><input id="story-author" type="text"></label>
          <label><span data-i18n="transitionText">Choice transition text</span><input id="transition-text" type="text"></label>
        </div>
      </section>
      <div class="workspace">
        <aside class="panel">
          <div class="section-heading">
            <h2 data-i18n="mindMap">Story map</h2>
            <button id="add-section" type="button" data-i18n="addSection">Add section</button>
          </div>
          <p class="hint" data-i18n="mapHint">Expand branches and select a section to edit it. The first section is the starting point.</p>
          <div id="map"></div>
        </aside>
        <section class="panel editor">
          <div class="section-heading">
            <h2 id="editor-heading"></h2>
            <button id="delete-section" type="button" data-i18n="deleteSection">Delete section</button>
          </div>
          <label><span data-i18n="sectionName">Section name (editor only)</span><input id="section-name" type="text"></label>
          <label id="content-label" data-i18n="content">Story text</label>
          <div class="toolbar" aria-label="Formatting">
            <button type="button" data-command="bold" data-i18n="bold">Bold</button>
            <button type="button" data-command="italic" data-i18n="italic">Italic</button>
            <label><span data-i18n="fontSize">Text size</span>
              <select id="font-size">
                <option value="2" data-i18n="small">Small</option>
                <option value="3" data-i18n="normal" selected>Normal</option>
                <option value="5" data-i18n="large">Large</option>
              </select>
            </label>
          </div>
          <div id="content" class="content" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="content-label"></div>
          <label class="check"><input id="ending" type="checkbox"><span data-i18n="ending">This is an ending</span></label>
          <div id="branch-controls">
            <label class="check"><input id="loop-enabled" type="checkbox"><span data-i18n="loop">Loop to section</span></label>
            <select id="loop-target" aria-label="Loop destination"></select>
            <div class="section-heading">
              <h3 data-i18n="choices">Choices</h3>
              <button id="add-choice" type="button" data-i18n="addChoice">Add choice</button>
            </div>
            <div id="choices"></div>
          </div>
          <p id="status" role="status" aria-live="polite"></p>
        </section>
      </div>
    </main>
    <footer class="save-warning" data-i18n="saveWarning">Important: Save your work as JSON regularly. Unsaved changes will be lost if you refresh or close this page.</footer>
  </div>
</body>
</html>
